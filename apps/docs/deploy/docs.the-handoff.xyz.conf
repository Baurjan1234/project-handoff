# docs.the-handoff.xyz — static documentation, one self-contained HTML file.
# Nothing here proxies and nothing here holds a key: this vhost serves files only.
# Source of truth is apps/docs/deploy/ in the repo.
# Install as /etc/nginx/sites-available/docs.the-handoff.xyz, symlink into
# sites-enabled, then let certbot add the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name docs.the-handoff.xyz;

    root /var/www/docs.the-handoff.xyz;
    index index.html;

    access_log /var/log/nginx/docs.access.log;
    error_log  /var/log/nginx/docs.error.log;

    # certbot writes its challenge here; must stay reachable over plain HTTP
    # so renewal does not need a restart.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # The page is ~48KB of inline CSS and JS. Compressing it is the whole
    # performance story.
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # /install and /install.html both resolve; a missing page falls back to
    # the docs index rather than nginx's default 404.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # HTML must not be cached hard — this page changes up to the freeze.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
